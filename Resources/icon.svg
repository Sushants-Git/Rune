<!-- The app icon: the same mark as the website's favicon — an ink tile, a
     prompt, and the marker-yellow cursor sitting at it — redrawn at macOS icon
     proportions. The tile is inset ~10% on a 1024 canvas with the squircle-ish
     corner radius Big Sur icons use, because a full-bleed rounded rect reads
     as a web favicon in the Dock, not an app.
     scripts/make-icon.sh turns this into Resources/AppIcon.icns. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#1b1b1b"/>
  <path d="M331.75 396.125 447.625 512 331.75 627.875" stroke="#fcfcfc"
        stroke-width="67" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="524.875" y="383.25" width="167.375" height="257.5" rx="25.75" fill="#ffe27a"/>
</svg>
