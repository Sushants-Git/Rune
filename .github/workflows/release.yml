# Cut a release: push a tag like v0.1.0 and this builds Rune.app on an
# Apple-silicon runner and attaches both a zip and a disk image to a GitHub
# Release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The expensive step is libghostty (a full Zig build of ghostty's core), so the
# resulting xcframework is cached keyed on GHOSTTY_COMMIT — releases that don't
# bump ghostty skip it entirely. Builds are universal (arm64 + x86_64) so one
# download covers both Apple silicon and Intel Macs, and ad-hoc signed, which
# means downloaders currently have to clear Gatekeeper once
# (right-click → Open, or `xattr -dr com.apple.quarantine Rune.app`).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # macos-26, and the newest Xcode on it: the sources rely on the macOS 26+
    # SDK's @MainActor annotations on AppKit protocols (NSTextInputClient et
    # al.) — older SDKs reject those conformances outright.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Cache GhosttyKit.xcframework
        id: ghostty-cache
        uses: actions/cache@v4
        with:
          path: vendor/ghostty/macos/GhosttyKit.xcframework
          # 'universal' is part of the key: a cached arm64-only xcframework
          # would fail the x86_64 link, and an artefact that can't be rebuilt
          # from its own key is worse than a cache miss.
          key: ghostty-${{ hashFiles('GHOSTTY_COMMIT') }}-universal

      - name: Set up Zig
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build libghostty
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        run: TARGET=universal ./scripts/build-libghostty.sh

      # macOS files the permissions a user grants under the app's designated
      # requirement, and an ad-hoc signature's requirement is the cdhash of
      # that single build — so every release read as a brand-new app and every
      # permission had to be granted again. Signing with one stable
      # certificate fixes that. See scripts/make-signing-cert.sh.
      #
      # Absent the secret this is a no-op and the build is ad-hoc signed, so
      # forks and pull requests still build.
      - name: Import the signing certificate
        env:
          P12: ${{ secrets.RUNE_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.RUNE_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::No signing certificate configured; this build is ad-hoc signed and will reset users' permissions."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/rune-signing.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/Rune.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Or it relocks mid-build and codesign fails with "no identity found".
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security import "$RUNNER_TEMP/Rune.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -A
          # Without this codesign blocks on a GUI prompt no one can answer.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Unquoted on purpose: the existing list must stay separate words.
          security list-keychains -d user -s \
            $(security list-keychains -d user | tr -d ' "') "$KEYCHAIN"

          # A self-signed certificate is not a signing identity until it is
          # trusted for code signing on the machine doing the signing. Users
          # need no such trust — the signature validates on its own.
          openssl pkcs12 -in "$RUNNER_TEMP/Rune.p12" -clcerts -nokeys \
            -out "$RUNNER_TEMP/cert.pem" -passin "pass:$P12_PASSWORD"
          security add-trusted-cert -r trustRoot -p codeSign \
            -k "$KEYCHAIN" "$RUNNER_TEMP/cert.pem"
          rm -f "$RUNNER_TEMP/Rune.p12" "$RUNNER_TEMP/cert.pem"

          identity="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)"
          if [ -z "$identity" ]; then
            echo "::error::certificate imported but no valid signing identity"
            exit 1
          fi
          echo "signing identity: $identity"
          echo "RUNE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "RUNE_SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build and bundle Rune.app
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            ARCH=universal VERSION="${GITHUB_REF_NAME#v}" ./scripts/bundle.sh
          else
            ARCH=universal ./scripts/bundle.sh
          fi

      # The requirement is the whole point of signing, so it gets checked
      # rather than assumed. A cdhash in here means the build went out ad-hoc
      # and every user's permissions are about to reset.
      - name: Verify the designated requirement is stable
        run: |
          requirement="$(codesign -d -r- build/Rune.app 2>&1 | tail -1)"
          echo "$requirement"
          if [ -n "${RUNE_SIGN_IDENTITY:-}" ]; then
            case "$requirement" in
              *cdhash*)
                echo "::error::signed build still has a cdhash requirement"
                exit 1 ;;
              *"certificate leaf"*) echo "requirement is identity-based" ;;
              *) echo "::error::unrecognised requirement"; exit 1 ;;
            esac
          fi

      # Both slices have to actually be present. A universal build that
      # quietly came out single-architecture would only be discovered by an
      # Intel user, after release.
      - name: Verify the binary is universal
        run: |
          archs="$(lipo -archs build/Rune.app/Contents/MacOS/Rune)"
          echo "architectures: $archs"
          for want in arm64 x86_64; do
            case "$archs" in *"$want"*) ;; *) echo "error: missing $want" >&2; exit 1;; esac
          done

      # Both, and they are not redundant. The zip is what the in-app updater
      # downloads and unpacks unattended; the dmg is what a person opens, and
      # its /Applications symlink is what stops Rune living in ~/Downloads
      # where Raycast and Spotlight will never find it.
      - name: Zip the app
        run: ditto -c -k --keepParent build/Rune.app "Rune-${GITHUB_REF_NAME}-macos-universal.zip"

      - name: Build the disk image
        run: |
          VERSION="${GITHUB_REF_NAME#v}" ./scripts/make-dmg.sh
          mv build/Rune-*.dmg .

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Rune-*-macos-universal.zip
            Rune-*-macos-universal.dmg
          generate_release_notes: true
